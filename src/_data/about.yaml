# Bio paragraphs.
bio:
  - >-
    Hi — I'm Chancelor, a backend engineer. Right now I'm the founding
    backend engineer at Arodus, an early-stage startup whose product
    plugs into a company's accounting ledger and keeps watch over every
    vendor it pays. I'm the primary engineer on the backend and wrote
    most of it: I take a feature from a one-line ask through design,
    schemas, and implementation to unit, integration, and end-to-end
    tests. I also build and run the AWS infrastructure it lives on, and
    the LLM pipelines and agent tooling that sit on top.
  - >-
    I got here by way of four internships and co-ops — Johnson & Johnson
    (twice), Numerix, and NeuraFlash — plus a B.S. and M.S. in Computer
    Science from Stevens Institute of Technology. On the side I built
    LicenseGuard, a small fleet of services that checks a project's
    dependencies for license trouble, and I occasionally settle idle
    questions with a notebook and some data.
  - >-
    This site is a love letter to the Y2K era of interface design —
    specifically the PS2 port of The King of Fighters XI. Every screen
    you see here is pure HTML and CSS: the spinning disc, the page
    transitions, even the color palette you can play with on this page.
  - >-
    When I'm not pushing pixels with stylesheets, I'm probably playing
    the games that inspired this site.
